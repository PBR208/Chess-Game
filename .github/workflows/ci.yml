# Purpose: CI builds and tests the game on every push to main and on every pull request. I run the
# build on Windows, macOS and Linux and on the oldest and the newest Java version the project
# supports, so a portability problem shows up in a pull request instead of in a release. The jobs
# only need a JDK, because the build script is plain Java.
#
# Owner: PBR208 - https://github.com/PBR208/
# Version: 1.0

name: CI

on:
  push:
    branches: [main]
  pull_request:

# the build only reads the repository
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}, JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      # one failing platform shouldn't hide the results of the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # compiles for Java 17, runs the headless tests and packages the jar
      - name: Build, test and package
        run: java build/Build.java
