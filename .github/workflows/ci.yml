# Purpose: CI builds and tests the game on every push to main and on every pull request. I run the
# build on Windows, macOS and Linux and on the oldest and the newest Java version the project
# supports, so a portability problem shows up in a pull request instead of in a release. The jobs
# only need a JDK, because the build script is plain Java.
#
# Owner: PBR208 - https://github.com/PBR208/
# Version: 1.0

name: CI

on:
  push:
    branches: [main]
  pull_request:

# the build only reads the repository
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}, JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      # one failing platform shouldn't hide the results of the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # compiles for Java 17, runs the headless tests and packages the jar
      - name: Build, test and package
        run: java build/Build.java
      # the dialog and frame tests need a display, Linux runners get a virtual one
      - name: Window tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum java build/Build.java test-gui
      # keep the jar built with the oldest supported Java so it can be downloaded and tried
      - name: Upload the jar
        if: runner.os == 'Linux' && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Game-jar
          path: out/Chess-Game.jar

  # An application image carries its own Java runtime, so a player needs nothing installed. jpackage
  # cannot build for another operating system, so every platform builds its own image on its own
  # runner. This stays an app image on purpose: an msi or exe would additionally need WiX on the
  # Windows runner, and a signed, notarized macOS app needs an Apple developer account, which is a
  # manual release step rather than something a build can do.
  package:
    name: Application image for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # one platform failing to package must not hide whether the others did
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # the image is built with the oldest supported Java, which the classes target anyway
          java-version: '17'
      - name: Build the application image
        run: java build/Build.java package
      - name: Upload the application image
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Game-${{ matrix.os }}
          path: out/package/
