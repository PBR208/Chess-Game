# Every text a player reads, in English. This is also the fallback for any language that has no
# text of its own, so every key has to exist here.
#
# Sentences with a name or a number in them use numbered places such as {0}, which MessageFormat
# fills in. MessageFormat treats a single quote as an escape, so the texts here avoid apostrophes
# rather than doubling them, which is easy to get wrong in a translation.
#
# Owner: PBR208 - https://github.com/PBR208/

